<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LoCo Control // Hybrid</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #ecf0f1;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR (Controls) --- */
        #sidebar {
            width: 320px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.1em;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 800;
        }

        .subtitle {
            color: #555;
            font-size: 0.7em;
            margin-bottom: 20px;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title {
            color: #444;
            font-size: 0.65em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        /* Global Buttons */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-kill {
            grid-column: span 2;
        }

        button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75em;
            color: white;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-start {
            background: #0f2b18;
            color: #2ecc71;
            border: 1px solid #1e5c36;
        }

        .btn-start:hover {
            background: #2ecc71;
            color: #000;
        }

        .btn-stop {
            background: #3d2605;
            color: #f1c40f;
            border: 1px solid #754c0b;
        }

        .btn-stop:hover {
            background: #f1c40f;
            color: #000;
        }

        .btn-kill {
            background: #300e0e;
            color: #e74c3c;
            border: 1px solid #751b12;
        }

        .btn-kill:hover {
            background: #e74c3c;
            color: white;
        }

        /* Process List */
        .process-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #111;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 2px solid #222;
        }

        .proc-online {
            border-left-color: #2ecc71;
        }

        .proc-stopped {
            border-left-color: #555;
        }

        .proc-errored {
            border-left-color: #e74c3c;
        }

        .proc-name {
            font-size: 0.8em;
            font-weight: bold;
            color: #ddd;
        }

        .btn-toggle {
            padding: 3px 8px;
            font-size: 0.65em;
            background: #222;
            color: #888;
            border: 1px solid #333;
        }

        .btn-toggle:hover {
            background: #fff;
            color: #000;
        }

        /* Script List */
        .script-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #1a1a1a;
        }

        .script-row:hover {
            background: #111;
        }

        .script-name {
            font-size: 0.75em;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .script-type {
            font-size: 0.6em;
            color: #444;
            margin-right: 5px;
            text-transform: uppercase;
        }

        .btn-run {
            padding: 2px 6px;
            font-size: 0.65em;
            background: none;
            border: 1px solid #333;
            color: #555;
        }

        .btn-run:hover {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* --- DASHBOARD (WebView) --- */
        #main-view {
            flex-grow: 1;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            pointer-events: none;
            z-index: 10;
        }

        .loader-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid #333;
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h1>LoCo CONTROL</h1>
        <span class="subtitle">System Manager // Hybrid</span>

        <div class="controls-grid">
            <button class="btn-start" onclick="control('start')">START SYSTEM</button>
            <button class="btn-stop" onclick="control('stop')">STOP ALL</button>
            <button class="btn-kill" onclick="control('kill')">💀 KILL ALL</button>
        </div>

        <div class="section-title">Active Fleet</div>

        <!-- Legend -->
        <div
            style="display: flex; justify-content: space-between; font-size: 0.6em; color: #555; padding: 0 5px; margin-bottom: 5px;">
            <span>SERVICE</span>
            <div style="display: flex; gap: 8px;">
                <span>BOOT</span>
                <span>CRASH</span>
                <span>STATUS</span>
            </div>
        </div>

        <div id="process-list">
            <div style="font-size:0.7em; color:#444">Scanning PM2...</div>
        </div>

        <div class="section-title">Command Scripts</div>
        <div id="script-list">
            <div style="font-size:0.7em; color:#444">Scanning scripts...</div>
        </div>
    </div>

    <div id="main-view">
        <div class="loading-overlay" id="loader">
            <div class="loader-spinner"></div>
            <div style="font-size: 0.8em; letter-spacing: 1px; color: #555;">CONNECTING TO DASHBOARD...</div>
        </div>
        <iframe src="http://localhost:3300/dashboard"
            onload="setTimeout(() => document.getElementById('loader').style.display='none', 500)"></iframe>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
