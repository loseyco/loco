<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background-color: #0a0a0b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    color: #e1e1e6;
    border: 10px solid #c1a35f;
  }
  .title {
    font-size: 100px;
    font-weight: 900;
    color: #c1a35f;
    margin-bottom: 10px;
    letter-spacing: -2px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 42px;
    font-weight: 500;
    margin-bottom: 40px;
  }
  .tagline {
    font-size: 24px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 4px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="title">The Werk Shop</div>
  <div class="subtitle">Live Restoration Timeline</div>
  <div class="tagline">Transparency • Craftsmanship • Real-time Updates</div>
</body>
</html>
